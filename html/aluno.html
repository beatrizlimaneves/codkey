<script>
  document.querySelector("form").addEventListener("submit", async function(evento) {
    evento.preventDefault();

    // Pega os valores dos campos (confira se os IDs batem com os seus inputs)
    const aluno = {
      nome: document.getElementById("nome").value,
      email: document.getElementById("email").value,
      telefone: document.getElementById("telefone").value,
      idade: document.getElementById("idade") ? document.getElementById("idade").value : null
    };

    try {
      const resposta = await fetch("/api/alunos", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(aluno)
      });

      const dados = await resposta.json();

      if (resposta.ok) {
        alert("Aluno cadastrado com sucesso!");
        window.location.href = "aluno.html";
      } else {
        alert("Erro: " + (dados.erro || "Não foi possível cadastrar."));
      }
    } catch (erro) {
      alert("Erro de conexão ao tentar cadastrar o aluno.");
      console.error(erro);
    }
  });
</script>
