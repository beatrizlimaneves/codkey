<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Alunos</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="../css/alunos.css">
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-icon">🏋️</span>
            <span class="brand-name">AcademiaFit</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#" class="active">Alunos</a></li>
            <li><a href="#">Professores</a></li>
            <li><a href="#">Planos</a></li>
            <li><a href="#">Pagamentos</a></li>
            <li><a href="#">Treinos</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-container">
        <div class="header-actions">
            <h1 class="title">Alunos</h1>
            <button class="btn-add">+ Novo aluno</button>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Plano</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="empty-message">Nenhum aluno cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
