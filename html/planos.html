<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Planos</title>
    <!-- Vinculando o mesmo arquivo CSS -->
    <link rel="stylesheet" href="../css/prof.css">
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-icon">🏋️</span>
            <span class="brand-name">AcademiaFit</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">Dashboard</a></li>
            <li><a href="index.html">Alunos</a></li>
            <li><a href="professores.html">Professores</a></li>
            <li><a href="#" class="active">Planos</a></li>
            <li><a href="#">Pagamentos</a></li>
            <li><a href="#">Treinos</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-container">
        
        <!-- Bloco do Formulário de Cadastro -->
        <section class="form-container">
            <h2 class="form-title">Cadastrar Plano</h2>
            <form>
                <div class="form-group">
                    <label for="nome-plano">Nome do Plano</label>
                    <input type="text" id="nome-plano" placeholder="Ex: Plano Mensal, Plano Anual">
                </div>
                
                <div class="form-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="text" id="valor" placeholder="Ex: 89,90">
                </div>
                
                <div class="form-group">
                    <label for="duracao">Duração (Meses)</label>
                    <input type="number" id="duracao" placeholder="Ex: 1, 12">
                </div>
                
                <div class="form-group">
                    <label for="descricao">Descrição / Benefícios</label>
                    <input type="text" id="descricao" placeholder="Ex: Acesso livre a musculação e área cardio">
                </div>
                
                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </section>

        <!-- Bloco de Planos Cadastrados -->
        <h2 class="section-title">Planos cadastrados</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome do Plano</th>
                        <th>Valor</th>
                        <th>Duração</th>
                        <th>Descrição</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- As linhas com os dados dos planos entrarão aqui -->
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
