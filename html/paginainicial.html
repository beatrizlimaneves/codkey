<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Dashboard</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="../css/pagina.css">
    <!-- Importação de ícones via CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Menu Superior -->
    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-dumbbell"></i> AcademiaFit
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Alunos</a></li>
            <li><a href="#">Professores</a></li>
            <li><a href="#">Planos</a></li>
            <li><a href="#">Pagamentos</a></li>
            <li><a href="#">Treinos</a></li>
            <li><a href="#">Sair</a></li>
        </ul>
    </nav>

    <!-- Área do Dashboard -->
    <main class="container">
        <h1 class="page-title">Dashboard</h1>

        <div class="cards-grid">
            <!-- Card Alunos -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-users blue-icon"></i> Alunos
                </div>
                <div class="card-value">0</div>
            </div>

            <!-- Card Professores -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-chalkboard-user orange-icon"></i> Professores
                </div>
                <div class="card-value">0</div>
            </div>

            <!-- Card Planos -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-address-card teal-icon"></i> Planos
                </div>
                <div class="card-value">0</div>
            </div>
        </div>
    </main>

</body>
</html>
