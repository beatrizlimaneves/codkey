<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | AcademiaFit</title>
  <link rel="stylesheet" href="../css/tema-roxo.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit" class="brand-logo">
      <p class="brand-tags">SAÚDE • DISCIPLINA • RESULTADOS</p>
      <h1>Comece sua jornada.</h1>
      <p class="brand-subtitle">Crie seu acesso para administrar sua academia em um só lugar.</p>
    </div>

    <div class="login-card">
      <img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit" class="card-logo">
      <span class="badge">NOVO ACESSO</span>
      <h2>Criar conta</h2>
      <p class="subtitle">Preencha os dados para cadastrar seu usuário.</p>

      <form id="formCadastro">
        <div class="input-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Crie uma senha" required>
        </div>

        <button type="submit" class="btn-primary">Criar minha conta →</button>
        <p id="mensagemStatus" style="color: #d93025; margin-top: 12px; font-size: 14px;"></p>
      </form>

      <p class="footer-link">
        Já tem conta? <a href="login.html">Voltar para o login</a>
      </p>
      <p class="security-note">🔒 Sua senha é armazenada com proteção criptográfica</p>
    </div>
  </div>

  <script>
    document.getElementById("formCadastro").addEventListener("submit", async function(event) {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const msgStatus = document.getElementById("mensagemStatus");
      msgStatus.style.color = "#d93025";
      msgStatus.textContent = "Cadastrando...";

      try {
        const resposta = await fetch("/api/cadastro", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, email, senha })
        });

        const dados = await resposta.json();

        if (resposta.ok) {
          msgStatus.style.color = "#188038";
          msgStatus.textContent = "Conta criada com sucesso! Redirecionando...";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } else {
          msgStatus.textContent = dados.erro || "Não foi possível criar a conta.";
        }
      } catch (erro) {
        msgStatus.textContent = "Falha de conexão com o servidor (Failed to fetch).";
        console.error(erro);
      }
    });
  </script>

</body>
</html>
